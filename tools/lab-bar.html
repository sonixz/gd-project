<div class="gdlab" data-gd-lab-bar>
<style>
.gdlab{background:#0d131b;color:#c9d3e0;border-bottom:1px solid #263242;font:500 13px/1.2 system-ui,"Segoe UI",sans-serif;position:relative;z-index:60}
.gdlab__in{max-width:1180px;margin:0 auto;padding:7px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:18px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}

.gdlab a{color:#c9d3e0;text-decoration:none}
.gdlab a:hover{color:#fff}
.gdlab a[aria-current]{color:#fff;font-weight:700}
.gdlab__home{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:#fff!important}
.gdlab__tag{color:#7f8ca0;font-weight:400}

.gdlab__sep{width:1px;height:14px;background:#263242}
